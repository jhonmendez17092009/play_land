    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554, #164e63);
            color: #f8fafc;
        }

        header {
            text-align: center;
            padding: 35px 20px 25px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.2rem);
            color: #67e8f9;
            text-shadow: 0 0 18px rgba(103, 232, 249, 0.35);
        }

        .subtitulo {
            margin: 10px 0 0;
            color: #cbd5e1;
            font-size: 1rem;
        }

        .contenedor-juegos {
            width: min(1200px, 92%);
            margin: 0 auto 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 22px;
        }

        .juego {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(103, 232, 249, 0.22);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .juego:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(34, 211, 238, 0.2);
        }

        .juego h3 {
            min-height: 42px;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            font-size: 1.05rem;
        }

        .juego a {
            display: block;
        }

        .juego img {
            width: 100%;
            max-width: 160px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            border: 2px solid rgba(103, 232, 249, 0.35);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .juego:hover img {
            transform: scale(1.04);
            border-color: #67e8f9;
        }

        @media (max-width: 500px) {
            .contenedor-juegos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .juego {
                padding: 12px;
            }

            .juego h3 {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
